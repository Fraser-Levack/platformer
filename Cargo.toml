[package]
name = "platformer"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"

[dependencies]
macroquad = { version = "0.4", features = ["audio"] }
gilrs = "0.11"

# Keep debug builds playable: optimize dependencies, lightly optimize our code.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
